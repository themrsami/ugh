title: Node ran out of memory
match:
  - 'JavaScript heap out of memory'
why: |
  V8 caps its heap (often around 2-4 GB) no matter how much RAM the
  machine has. Big builds hit that cap. Raising it gets you moving; if a
  server hits it at runtime you probably have a leak, and raising the
  limit only delays the crash.
fix:
  - run: export NODE_OPTIONS=--max-old-space-size=8192
    note: 8 GB, then re-run
examples:
  - |
    <--- Last few GCs --->

    [41235:0x5a2b1c0]    82134 ms: Mark-sweep 2041.3 (2087.4) -> 2040.9 (2087.9) MB, 1532.1 / 0.0 ms  (average mu = 0.112, current mu = 0.004) allocation failure; scavenge might not succeed

    FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory
