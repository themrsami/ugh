title: "Python can't import '{{module}}'"
match:
  - "ModuleNotFoundError: No module named '(?P<module>[^']+)'"
why: |
  If you're sure you installed it, you installed it into a different
  Python than the one running your script. System python vs a venv vs
  conda vs pyenv: each has its own site-packages. Check which one you're
  on before installing again. (Also: the pip name isn't always the import
  name. `import yaml` is PyYAML, `import cv2` is opencv-python.)
fix:
  - run: which python && python -m pip --version
    note: do these point at the same place?
  - run: python -m pip install {{module}}
    note: installs into the python you're actually running
examples:
  - |
    Traceback (most recent call last):
      File "/home/sam/app/main.py", line 1, in <module>
        import requests
    ModuleNotFoundError: No module named 'requests'
