title: GitHub stopped accepting passwords over HTTPS
match:
  - 'Support for password authentication was removed'
why: |
  Your account password hasn't worked for git since August 2021. Over
  HTTPS you need a personal access token in its place, or let the gh CLI
  handle credentials, or switch the remote to SSH.
fix:
  - run: gh auth login
    note: easiest
  - run: git remote set-url origin git@github.com:OWNER/REPO.git
    note: or go SSH
see:
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
examples:
  - |
    remote: Support for password authentication was removed on August 13, 2021.
    remote: Please see https://docs.github.com/get-started/getting-started-with-git/about-remote-repositories#cloning-with-https-urls for information on currently recommended modes of authentication.
    fatal: Authentication failed for 'https://github.com/acme/api.git/'
