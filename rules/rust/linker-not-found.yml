title: Rust needs a C linker and there isn't one
match:
  - 'error: linker `(?P<linker>[^`]+)` not found'
why: |
  rustc compiles your code but hands the final linking step to the
  system's C toolchain. On a fresh machine or a slim Docker image that
  toolchain isn't installed.
fix:
  - run: sudo apt install build-essential
    note: Debian, Ubuntu
  - run: sudo dnf install gcc
    note: Fedora
  - run: xcode-select --install
    note: macOS
  - run: apk add build-base
    note: Alpine
examples:
  - |
    error: linker `cc` not found
      |
      = note: No such file or directory (os error 2)

    error: could not compile `api` (bin "api") due to 1 previous error
