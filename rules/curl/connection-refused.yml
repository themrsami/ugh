title: "Nothing is listening on {{host}}:{{port}}"
match:
  - 'curl: \(7\) Failed to connect to (?P<host>\S+) port (?P<port>\d+)'
why: |
  curl reached the machine and the connection was turned away, so no
  program has that port open. For localhost that means your server
  isn't up yet, crashed on start, or is on a different port than you
  think. Also check what it binds to: a server listening on 127.0.0.1
  inside a container is unreachable from outside it, it has to bind
  0.0.0.0.
fix:
  - run: lsof -i :{{port}}
    note: empty output means nothing is listening
  - run: ss -ltnp
    note: Linux, everything that is listening and on which address
examples:
  - |
    curl: (7) Failed to connect to 127.0.0.1 port 59999 after 0 ms: Couldn't connect to server
  - |
    curl: (7) Failed to connect to localhost port 8080: Connection refused
